plugins {
    id 'multiloader-loader'
    id 'net.fabricmc.fabric-loom'
}
dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    // Minecraft 26.1+ is unobfuscated and does not publish separate mappings.
    implementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"

    implementation "com.kohlschutter.junixsocket:junixsocket-common:2.10.1"
    include "com.kohlschutter.junixsocket:junixsocket-common:2.10.1"
    implementation "com.kohlschutter.junixsocket:junixsocket-native-common:2.10.1"
    include "com.kohlschutter.junixsocket:junixsocket-native-common:2.10.1"

    implementation 'io.github.CDAGaming:DiscordIPC:0.10.2'
    include 'io.github.CDAGaming:DiscordIPC:0.10.2'
}

loom {
    def aw = project(':common').file("src/main/resources/${mod_id}.accesswidener")
    if (aw.exists()) {
        accessWidenerPath.set(aw)
    }
    runs {
        client {
            client()
            setConfigName('Fabric Client')
            ideConfigGenerated(true)
            runDir('runs/client')
        }
        server {
            server()
            setConfigName('Fabric Server')
            ideConfigGenerated(true)
            runDir('runs/server')
        }
    }
}
